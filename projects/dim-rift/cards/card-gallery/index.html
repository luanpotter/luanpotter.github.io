<script>
  // Every element in #cards with a data-name is a card the filters show or hide, by the keys card-filter-keys writes.
  document.addEventListener('DOMContentLoaded', () => {
    const cards = [...document.querySelectorAll('#cards [data-name]')];
    const cardFilter = document.querySelector('#filter-card');

    const filters = {
      name: '',
      factions: new Set(['men', 'fey', 'telur', 'wynn', 'unaligned']),
      extras: new Set(['true', 'false']),
      types: new Set(['creature', 'artifact', 'monument']),
      references: new Set(['false']),
    };

    // A card without a key for some filter, as a reference card has no faction, deck or type, passes that filter.
    const passes = (node, attribute, set) => {
      const key = node.getAttribute(attribute);
      return key === null || set.has(key);
    };

    const doFilter = () => {
      cards.forEach((node) => {
        const name = node.getAttribute('data-name');
        const visible =
          name.toLowerCase().includes(filters.name) &&
          passes(node, 'data-faction-key', filters.factions) &&
          passes(node, 'data-extra-key', filters.extras) &&
          passes(node, 'data-type-key', filters.types) &&
          passes(node, 'data-reference-key', filters.references);
        node.style.display = visible ? 'block' : 'none';
      });
    };

    const setupIcons = (selector, set, attribute) => {
      document.querySelectorAll(selector).forEach((icon) => {
        icon.addEventListener('click', () => {
          const key = icon.getAttribute(attribute);
          if (icon.classList.toggle('selected')) {
            set.add(key);
          } else {
            set.delete(key);
          }
          doFilter();
        });
      });
    };

    cardFilter.addEventListener('input', () => {
      filters.name = cardFilter.value.toLowerCase();
      doFilter();
    });
    setupIcons('#faction-icons img', filters.factions, 'data-faction-key');
    setupIcons('#extra-icons img', filters.extras, 'data-extra-key');
    setupIcons('#type-icons img', filters.types, 'data-type-key');
    setupIcons('#reference-icons img', filters.references, 'data-reference-key');

    doFilter();
  });
</script>
